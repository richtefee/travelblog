{{- $id := printf "map-%d" now.UnixNano -}}
{{- .Inner -}}

{{- $geojson := .Scratch.Get "geojson_url" | default "" -}}

<div
  id="{{ $id }}"
  class="map"
  data-geojson="{{ $geojson }}"
  data-lat="{{ .Get "lat" | default "0" }}"
  data-lon="{{ .Get "lon" | default "0" }}"
  data-zoom="{{ .Get "zoom" | default "2" }}"
></div>


<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.css"
/>

<script type="module">
  import * as maplibregl from "https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.mjs";
  window.maplibregl = maplibregl;
  window.dispatchEvent(new Event("maplibre-ready"));
</script>

<script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

{{- $js := resources.Get "js/map/index.js" | js.Build -}}
<script src="{{ $js.RelPermalink }}" defer></script>

<style>
  .map {
    width: 100%;
    height: 400px;
    border-radius: 0.5rem;
    background-color: #f0f0f0;
    visibility: hidden;
  }

  .map.is-ready {
    visibility: visible;
  }
</style>
